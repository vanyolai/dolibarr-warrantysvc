name: PHP lint

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: Lint PHP files
        run: find module -type f -name '*.php' -print0 | xargs -0 -n1 php -l
